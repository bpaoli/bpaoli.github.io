### Site Settings ###
title               : Bradley Paoli
description         : >-
                      "Coffee :coffee: fueled solutions engineer for real-world problems. I thrive on turning complex challenges into streamlined code."
baseurl             : "portfolio"            # Change to empty quotes if you are hosting your site at <your-username>.github.io directly
repository          : bpaoli/bpaoli.github.io      # Change to <your-username>/<your-username>.github.io (or remove it if you don't need remote projects)
theme               : null
open_new_tab        : false                    # Opens external URLs in new tab (works for posts, projects and navbar only)


### Plugins ###
plugins:
  - jemoji


### Navbar Settings ###
nav_exclude:                                            # The following paths are excluded from navbar
  - pages/tags.html
  - pages/404.html
  - pages/index.md
  - documentation/partials/**                           # For Documentation Only
  - pages/blog.html
  - documentation/elements.html
  - documentation/docs.md


